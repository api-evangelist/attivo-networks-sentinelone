aid: attivo-networks-sentinelone
name: Attivo Networks (SentinelOne)
description: >-
  Attivo Networks was a pioneer in identity threat detection and response (ITDR),
  cyber deception, and Active Directory attack protection. SentinelOne acquired
  Attivo Networks in 2022 and folded its technology into SentinelOne Singularity
  Identity, part of the AI-powered Singularity security platform spanning endpoint
  (EDR/XDR), identity, and cloud security. There is no standalone public Attivo
  API; programmatic access is delivered through the SentinelOne management console
  REST API (v2.1), which is scoped to a customer's console URL rather than a public
  developer portal. This API Evangelist profile tracks the combined entity's public
  security, trust, disclosure, and compliance surface: a published RFC 9116
  security.txt, a HackerOne-hosted bug bounty, and a SafeBase trust center carrying
  SOC 2 Type 2, ISO 27001/27017/27018, FedRAMP, and TX-RAMP certifications.
